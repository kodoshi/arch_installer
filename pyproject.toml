[tool.poetry]
name = "arch-installer"
version = "0.1.0"
description = "Declarative, deterministic, and idempotent Arch Linux installer"
readme = "README.md"
packages = [{ include = "arch_installer", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13"
pyyaml = "^6.0.3"
cryptography = "^46.0.3"

[tool.poetry.scripts]
arch-installer = "arch_installer.cli:main"
usb-init = "arch_installer.cli:usb_init"
usb-backup = "arch_installer.cli:usb_backup"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
pytest-timeout = "^2.4.0"
ruff = "^0.16.10"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports and names, undefined names
    "I",   # import sorting
    "N",   # pep8 naming
    "B",   # bugbear: likely bugs and design problems
    "UP",  # pyupgrade: modern syntax for the target python
    "SIM", # simplifications
    "RUF", # ruff specific checks
]
# the formatter owns line length; long string literals are left alone
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["arch_installer", "tests"]

[tool.pytest.ini_options]
# unit tests can run in parallel with: pytest tests/unit -n auto
addopts = "-v -p no:warnings"
testpaths = ["tests"]
markers = [
    "qemu: tests that require QEMU VM infrastructure",
    "slow: tests that take a long time to run (>1 minute)",
]

[tool.coverage.run]
source = ["src/arch_installer"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
